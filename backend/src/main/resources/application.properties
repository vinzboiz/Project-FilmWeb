server.port=5000

# Auto-load local .env file (KEY=VALUE format) when present
spring.config.import=optional:file:.env[.properties]

# MySQL - fixed project database name: thungphim
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/thungphim?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - avoid stale MySQL connections (\"No operations allowed after connection closed\")
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000

# JPA - do not alter schema (DB already from Prisma)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Auto bootstrap schema for all developers
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# JWT (read from environment variable in production)
jwt.secret=${JWT_SECRET:change-me-in-env}
jwt.expiration-ms=604800000

# OAuth2 Google (set env vars from Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional tuning
spring.jpa.open-in-view=false

# Upload paths (project root: uploads/)
app.upload.root=../uploads
app.upload.images=${app.upload.root}/images
app.upload.videos=${app.upload.root}/videos

# Multipart upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
