<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/github-inspired.css}" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">ThungPhim</div>
      <div class="topbar-spacer"></div>
      <div class="menu">
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/}">Home</a>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="link-btn">Logout</button>
        </form>
      </div>
    </header>

    <main class="page-grid single">
      <section class="card">
        <p class="muted">Role</p>
        <h1>ADMIN Dashboard</h1>
        <p>Xin chào admin, <strong th:text="${displayName}">email</strong>.</p>
        <p>
          Database đang kết nối: <code th:text="${connectedDb}">thungphim</code>
        </p>
      </section>

      <section class="card">
        <p class="muted">Quản lý thể loại</p>
        <h2>Thêm thể loại mới</h2>

        <div
          th:if="${genreError}"
          class="signed-in-box error-box"
          th:text="${genreError}"
        >
          Lỗi
        </div>
        <div
          th:if="${genreSuccess}"
          class="signed-in-box success-box"
          th:text="${genreSuccess}"
        >
          Thành công
        </div>

        <form
          class="genre-form"
          th:action="@{/admin/genres}"
          method="post"
          enctype="multipart/form-data"
        >
          <input type="text" name="name" placeholder="Tên thể loại" required />
          <label class="file-label" for="thumbnailFileCreate"
            >Ảnh thumbnail (tuỳ chọn)</label
          >
          <input
            id="thumbnailFileCreate"
            type="file"
            name="thumbnailFile"
            accept="image/*"
          />
          <textarea
            name="description"
            rows="3"
            placeholder="Mô tả (tuỳ chọn)"
          ></textarea>
          <button type="submit" class="btn primary">Thêm thể loại</button>
        </form>

        <h2>Danh sách thể loại</h2>
        <div class="genre-list" th:if="${#lists.isEmpty(genres)}">
          Chưa có thể loại nào.
        </div>

        <div th:each="genre : ${genres}" class="genre-item">
          <form
            class="genre-form"
            th:action="@{'/admin/genres/' + ${genre.id} + '/update'}"
            method="post"
            enctype="multipart/form-data"
          >
            <input type="text" name="name" th:value="${genre.name}" required />
            <div th:if="${genre.thumbnailUrl}" class="thumbnail-preview-wrap">
              <img
                class="thumbnail-preview"
                th:src="${genre.thumbnailUrl}"
                alt="thumbnail"
              />
            </div>
            <label
              class="file-label"
              th:for="'thumbnailFileUpdate-' + ${genre.id}"
              >Đổi thumbnail (tuỳ chọn)</label
            >
            <input
              th:id="'thumbnailFileUpdate-' + ${genre.id}"
              type="file"
              name="thumbnailFile"
              accept="image/*"
            />
            <textarea
              name="description"
              rows="3"
              th:text="${genre.description}"
              placeholder="Mô tả"
            ></textarea>
            <div class="genre-actions">
              <button type="submit" class="btn primary">Lưu</button>
            </div>
          </form>

          <form
            th:action="@{'/admin/genres/' + ${genre.id} + '/delete'}"
            method="post"
          >
            <button type="submit" class="btn danger">Xóa</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
